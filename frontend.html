<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelOS</title>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
</style>
</head>
<body>
<!-- APP SHELL -->
<div id="app"></div>

<script>
const API = window.location.origin;
let token = '';
let destData = {};
let userName = '';
let fromCity = 'Buenos Aires';
let selections = {flight:null, hotel:null, activities:[]};
const MAPBOX_TOKEN = new URLSearchParams(window.location.search).get('tk') || localStorage.getItem('mapbox_tk') || '';
if(MAPBOX_TOKEN) { mapboxgl.accessToken = MAPBOX_TOKEN; localStorage.setItem('mapbox_tk', MAPBOX_TOKEN); }


// ─── RENDER ENGINE ─────────────────────────────
function render(html){ document.getElementById('app').innerHTML = html; }

// ─── LOGIN SCREEN ──────────────────────────────
function screenLogin(err=''){
  render(`
    <div style="max-width:400px;margin:60px auto;padding:20px;">
      <div style="text-align:center;margin-bottom:30px;">
        <h1 style="font-size:32px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">TravelOS</h1>
        <p style="color:#94a3b8;margin-top:5px;">Tu copiloto de viaje con IA</p>
      </div>
      <div style="background:#1e293b;border-radius:16px;padding:30px;">
        <h2 style="text-align:center;margin-bottom:20px;">Iniciá tu aventura</h2>
        <input id="f-email" type="email" placeholder="Email" value="demo@travelos.com" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
        <input id="f-pass" type="password" placeholder="Contraseña (min 8)" value="Password123!" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
        <input id="f-name" type="text" placeholder="Tu nombre" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
        <input id="f-from" type="text" placeholder="Desde dónde viajás (ej: Buenos Aires)" value="Buenos Aires" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
        <button onclick="doRegister()" style="width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#818cf8);color:white;">Crear cuenta</button>
        <button onclick="doLogin()" style="width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:#334155;color:white;margin-top:10px;">Ya tengo cuenta</button>
        ${err?`<p style="color:#f87171;text-align:center;margin-top:12px;font-size:13px;">${err}</p>`:''}
      </div>
    </div>
  `);
}


// ─── AUTH FUNCTIONS ────────────────────────────
async function doRegister(){
  const email=document.getElementById('f-email').value;
  const pass=document.getElementById('f-pass').value;
  const name=document.getElementById('f-name').value||'Viajero';
  fromCity=document.getElementById('f-from').value||'Buenos Aires';
  userName=name;
  try{
    let r=await fetch(`${API}/api/v1/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,name,language:'es'})});
    if(r.status===409) return doLogin();
    const d=await r.json();
    if(d.access_token){token=d.access_token;screenDestination();}
    else screenLogin(d.detail||'Error');
  }catch(e){screenLogin('Error de conexión');}
}

async function doLogin(){
  const email=document.getElementById('f-email').value;
  const pass=document.getElementById('f-pass').value;
  fromCity=document.getElementById('f-from').value||'Buenos Aires';
  try{
    const r=await fetch(`${API}/api/v1/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(d.access_token){token=d.access_token;screenDestination();}
    else screenLogin(d.detail||'Email o contraseña incorrectos');
  }catch(e){screenLogin('Error de conexión');}
}


// ─── DESTINATION SCREEN ────────────────────────
function screenDestination(){
  render(`
    <div style="background:#1e293b;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;">
      <h1 style="font-size:20px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">TravelOS</h1>
      <span style="color:#94a3b8;font-size:13px;">📍 <strong style="color:white;">${fromCity}</strong> &nbsp; <span onclick="changeOrigin()" style="color:#38bdf8;cursor:pointer;text-decoration:underline;">Cambiar</span> &nbsp; <span onclick="screenLogin()" style="color:#f87171;cursor:pointer;">Salir</span></span>
    </div>
    <div style="max-width:600px;margin:0 auto;padding:20px;">
      <div style="position:relative;margin-top:10px;">
        <span style="position:absolute;left:15px;top:16px;font-size:20px;">🌍</span>
        <input id="dest-input" type="text" placeholder="¿A dónde querés ir?" style="width:100%;padding:16px 16px 16px 45px;border:1px solid #334155;border-radius:12px;background:#0f172a;color:white;font-size:18px;outline:none;" onkeypress="if(event.key==='Enter')doExplore()">
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <div style="flex:1;">
          <label style="color:#94a3b8;font-size:11px;">Adultos</label>
          <select id="sel-adults" style="width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:white;font-size:14px;margin-top:4px;">
            <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option>
          </select>
        </div>
        <div style="flex:1;">
          <label style="color:#94a3b8;font-size:11px;">Niños</label>
          <select id="sel-kids" style="width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:white;font-size:14px;margin-top:4px;">
            <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          </select>
        </div>
        <div style="flex:1;">
          <label style="color:#94a3b8;font-size:11px;">Clase</label>
          <select id="sel-class" style="width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:white;font-size:14px;margin-top:4px;">
            <option value="economy">Económica</option><option value="premium">Premium</option><option value="business">Business</option><option value="first">Primera</option>
          </select>
        </div>
      </div>
      <p style="color:#64748b;margin-top:24px;font-size:14px;font-weight:600;">Destinos populares</p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px;">
        ${[
          {n:'Tokyo',e:'🗼',c:'Japan',p:120},
          {n:'París',e:'🇫🇷',c:'France',p:150},
          {n:'Bali',e:'🏝️',c:'Indonesia',p:50},
          {n:'Roma',e:'🏛️',c:'Italy',p:110},
          {n:'New York',e:'🗽',c:'USA',p:200},
          {n:'Cancún',e:'🏖️',c:'Mexico',p:80},
        ].map(d=>`
          <div onclick="doExplore('${d.n}, ${d.c}')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:all .2s;" onmouseover="this.style.borderColor='#38bdf8'" onmouseout="this.style.borderColor='#334155'">
            <div style="font-size:32px;">${d.e}</div>
            <div style="font-weight:600;margin-top:6px;">${d.n}</div>
            <div style="color:#4ade80;font-size:12px;margin-top:4px;">USD ${d.p}/día</div>
          </div>
        `).join('')}
      </div>
    </div>
  `);
}


// ─── EXPLORE ───────────────────────────────────
let destCache = {};
async function doExplore(dest){
  const destination = dest || document.getElementById('dest-input').value;
  if(!destination) return;
  
  const adults = document.getElementById('sel-adults')?.value || '2';
  const kids = document.getElementById('sel-kids')?.value || '0';
  const flightClass = document.getElementById('sel-class')?.value || 'economy';
  const travelers = parseInt(adults) + parseInt(kids);
  const cacheKey = `${destination}_${fromCity}_${travelers}_${flightClass}`;

  // Check cache
  if(destCache[cacheKey]){
    destData = destCache[cacheKey];
    destData._name = destination;
    destData._from = fromCity;
    destData._adults = adults;
    destData._kids = kids;
    destData._class = flightClass;
    selections = {flight:null, hotel:null, activities:[]};
    screenResults('overview');
    return;
  }

  // Loading screen
  render(`
    <div style="text-align:center;padding:100px 20px;">
      <div style="width:50px;height:50px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;"></div>
      <h3>Analizando ${destination}...</h3>
      <p style="color:#94a3b8;margin-top:10px;">Buscando vuelos desde ${fromCity} para ${travelers} pasajero${travelers>1?'s':''} (${flightClass})</p>
      <p style="color:#64748b;margin-top:8px;font-size:12px;">La próxima vez será instantáneo</p>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  `);

  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 min timeout
    const r=await fetch(`${API}/api/v1/destinations/explore`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({destination,from_city:fromCity,travelers:travelers,budget_usd:2500}),signal:controller.signal});
    clearTimeout(timeoutId);
    if(r.status===401){screenLogin('Sesión expirada. Logueate de nuevo.');return;}
    destData=await r.json();
    destData._name=destination;
    destData._from=fromCity;
    destData._adults=adults;
    destData._kids=kids;
    destData._class=flightClass;
    destCache[cacheKey]=destData; // Cache it
    selections={flight:null,hotel:null,activities:[]};
    screenResults('overview');
  }catch(e){
    if(e.name==='AbortError'){
      render(`<div style="text-align:center;padding:80px 20px;"><h3 style="color:#f87171;">⏱️ Tardó demasiado</h3><p style="color:#94a3b8;margin-top:10px;">El servidor tardó en responder. Intentá de nuevo.</p><button onclick="doExplore('${destination}')" style="margin-top:20px;padding:12px 24px;border:none;border-radius:8px;background:#38bdf8;color:white;font-weight:600;cursor:pointer;">Reintentar</button><br><button onclick="screenDestination()" style="margin-top:10px;padding:12px 24px;border:none;border-radius:8px;background:#334155;color:white;cursor:pointer;">← Volver</button></div>`);
    } else {
      render(`<div style="text-align:center;padding:80px 20px;"><h3 style="color:#f87171;">Error de conexión</h3><p style="color:#94a3b8;margin-top:10px;">No se pudo conectar al servidor.</p><button onclick="screenDestination()" style="margin-top:20px;padding:12px 24px;border:none;border-radius:8px;background:#334155;color:white;cursor:pointer;">← Volver</button></div>`);
    }
  }
}


// ─── RESULTS SCREEN ────────────────────────────
const TABS=[
  {id:'overview',icon:'📊',label:'Resumen'},
  {id:'flights',icon:'✈️',label:'Vuelos'},
  {id:'transport',icon:'🚇',label:'Transporte'},
  {id:'hotels',icon:'🏨',label:'Hoteles'},
  {id:'food',icon:'🍜',label:'Comida'},
  {id:'activities',icon:'🎯',label:'Actividades'},
  {id:'map',icon:'🗺️',label:'Mapa'},
  {id:'climate',icon:'🌤️',label:'Clima'},
  {id:'safety',icon:'🛡️',label:'Seguridad'},
  {id:'money',icon:'💰',label:'Dinero'},
  {id:'compare',icon:'📏',label:'Comparar'},
  {id:'itinerary',icon:'📋',label:'Itinerario'},
];

function screenResults(tab){
  const name=(destData._name||'').split(',')[0];
  const totalCost=(selections.flight||0);
  render(`
    <div style="background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #334155;position:sticky;top:0;z-index:1000;">
      <span onclick="screenDestination()" style="cursor:pointer;font-size:20px;">←</span>
      <h2 style="font-size:18px;flex:1;">${name}</h2>
      <span style="color:#94a3b8;font-size:12px;">desde ${fromCity}</span>
    </div>
    <div style="display:flex;overflow-x:auto;background:#1e293b;border-bottom:1px solid #334155;position:sticky;top:44px;z-index:999;scrollbar-width:none;" id="tabs-bar">
      ${TABS.map(t=>`<div onclick="screenResults('${t.id}')" style="padding:10px 14px;font-size:12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid ${t.id===tab?'#38bdf8':'transparent'};color:${t.id===tab?'#38bdf8':'#94a3b8'};">${t.icon} ${t.label}</div>`).join('')}
    </div>
    <div style="max-width:600px;margin:0 auto;padding:16px;padding-bottom:80px;" id="tab-content"></div>
    <div style="position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:1000;">
      <div style="font-size:13px;color:#94a3b8;">Total: <strong style="color:#4ade80;font-size:18px;">USD ${totalCost.toLocaleString()}</strong></div>
      <button onclick="alert('Próximo paso: reservar. Disponible en Sprint 2.')" style="padding:10px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:white;font-weight:600;cursor:pointer;font-size:13px;">Armar mi viaje →</button>
    </div>
  `);
  const content=document.getElementById('tab-content');
  const fn={overview:tabOverview,flights:tabFlights,transport:tabTransport,hotels:tabHotels,food:tabFood,activities:tabActivities,map:tabMap,climate:tabClimate,safety:tabSafety,money:tabMoney,compare:tabCompare,itinerary:tabItinerary};
  if(fn[tab]) content.innerHTML=fn[tab]();
  if(tab==='map') initMap();
  if(tab==='hotels') initHotelMap();
  if(tab==='activities') initActivitiesMap();
  if(tab==='transport') initTransportMap();
  if(tab==='itinerary') initItineraryMap();
}


// ─── TAB: OVERVIEW ─────────────────────────────
function tabOverview(){
  const qs=destData.quick_stats||{};
  const name=(destData._name||'').split(',')[0];
  return `
    <h3 style="font-size:20px;margin-bottom:16px;">📊 ${name} — Resumen rápido</h3>
    <div style="background:#1e293b;border-radius:12px;padding:20px;margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div><div style="color:#94a3b8;font-size:11px;">COSTO/DÍA</div><div style="font-size:24px;font-weight:700;color:#4ade80;">USD ${qs.avg_cost_per_day_usd||'?'}</div></div>
        <div><div style="color:#94a3b8;font-size:11px;">DÍAS IDEALES</div><div style="font-size:24px;font-weight:700;">${qs.ideal_days||'?'}</div></div>
        <div><div style="color:#94a3b8;font-size:11px;">MÍNIMO</div><div style="font-size:24px;font-weight:700;">${qs.min_days_recommended||'?'} días</div></div>
        <div><div style="color:#94a3b8;font-size:11px;">MEJOR ÉPOCA</div><div style="font-size:13px;font-weight:600;margin-top:4px;">${qs.best_time_to_visit||'?'}</div></div>
      </div>
    </div>
    <h3 style="font-size:16px;margin-bottom:12px;">Explorá cada sección ↓</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      ${TABS.filter(t=>t.id!=='overview').map(t=>`
        <div onclick="screenResults('${t.id}')" style="background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;text-align:center;cursor:pointer;" onmouseover="this.style.borderColor='#38bdf8'" onmouseout="this.style.borderColor='#334155'">
          <div style="font-size:24px;">${t.icon}</div>
          <div style="font-size:11px;margin-top:4px;color:#94a3b8;">${t.label}</div>
        </div>
      `).join('')}
    </div>
  `;
}


// ─── TAB: FLIGHTS ──────────────────────────────
function tabFlights(){
  const f=destData.flights||{};
  const opts=f.options||[];
  return `
    <h3 style="font-size:20px;margin-bottom:4px;">✈️ Vuelos desde ${fromCity}</h3>
    <p style="color:#94a3b8;font-size:13px;margin-bottom:16px;">Tocá un vuelo para seleccionarlo</p>
    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <div style="flex:1;background:#1e293b;border-radius:10px;padding:14px;text-align:center;">
        <div style="color:#94a3b8;font-size:11px;">MÁS BARATO</div>
        <div style="font-size:20px;font-weight:700;color:#4ade80;">USD ${f.cheapest_price||'?'}</div>
      </div>
      <div style="flex:1;background:#1e293b;border-radius:10px;padding:14px;text-align:center;">
        <div style="color:#94a3b8;font-size:11px;">MÁS RÁPIDO</div>
        <div style="font-size:20px;font-weight:700;color:#38bdf8;">${f.fastest_duration_hours||'?'}h</div>
      </div>
    </div>
    <div style="background:#334155;border-radius:8px;padding:10px;margin-bottom:16px;font-size:12px;color:#94a3b8;text-align:center;">
      💡 Mejor día para comprar: <strong style="color:white;">${f.best_day_to_buy||'?'}</strong>
    </div>
    ${opts.map(o=>`
      <div onclick="selectFlight(${o.price_usd})" style="background:#1e293b;border:2px solid ${selections.flight===o.price_usd?'#4ade80':'#334155'};border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all .2s;${selections.flight===o.price_usd?'box-shadow:0 0 15px rgba(74,222,128,0.2);':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-weight:600;font-size:16px;">${o.airline}</div>
          <div style="color:#4ade80;font-weight:700;font-size:20px;">USD ${o.price_usd}</div>
        </div>
        <div style="margin-top:8px;color:#94a3b8;font-size:13px;">
          ⏱️ ${o.duration_hours}h &nbsp;
          ${o.stops===0?'<span style="background:#065f46;color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;">Directo</span>':`<span style="background:#713f12;color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;">${o.stops} escala: ${(o.stop_cities||[]).join(', ')}</span>`}
          ${o.is_cheapest?'<span style="background:#065f46;color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;margin-left:4px;">💰 Más barato</span>':''}
          ${o.is_fastest?'<span style="background:#1e3a5f;color:#38bdf8;padding:2px 8px;border-radius:4px;font-size:11px;margin-left:4px;">⚡ Más rápido</span>':''}
        </div>
        <div style="margin-top:6px;color:#64748b;font-size:12px;">🧳 ${o.baggage_included?`${o.baggage_kg||23}kg incluido`:'Sin equipaje incluido'} &nbsp; ✈️ ${o.origin_airport||'?'} → ${o.destination_airport||'?'}</div>
        ${selections.flight===o.price_usd?'<div style="margin-top:8px;color:#4ade80;font-size:12px;font-weight:600;">✓ SELECCIONADO</div>':''}
      </div>
    `).join('')}
    ${(f.tips||[]).map(t=>`<div style="background:#334155;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:13px;color:#94a3b8;">💡 ${t}</div>`).join('')}
    <button onclick="loadMoreFlights()" id="btn-more-flights" style="width:100%;margin-top:16px;padding:14px;border:1px solid #38bdf8;border-radius:10px;background:transparent;color:#38bdf8;font-weight:600;cursor:pointer;font-size:14px;">✈️ Ver más vuelos</button>
  `;
}
function selectFlight(p){selections.flight=(selections.flight===p)?null:p;screenResults('flights');}
async function loadMoreFlights(){
  document.getElementById('btn-more-flights').textContent='Cargando...';
  try{
    const r=await fetch(`${API}/api/v1/destinations/more-flights`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({destination:destData._name,from_city:fromCity,travelers:1})});
    const d=await r.json();
    if(d.options){destData.flights.options=[...destData.flights.options,...d.options];screenResults('flights');}
  }catch(e){document.getElementById('btn-more-flights').textContent='Error, intentá de nuevo';}
}


// ─── TAB: TRANSPORT ────────────────────────────
function tabTransport(){
  const t=destData.transport||{};
  const name=(destData._name||'').split(',')[0];
  return `
    <h3 style="font-size:20px;margin-bottom:16px;">🚇 Transporte en ${name}</h3>
    <div id="transport-map" style="height:250px;border-radius:12px;margin-bottom:16px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <div style="flex:1;background:#065f46;border:1px solid #4ade80;border-radius:10px;padding:12px;text-align:center;">
        <div style="font-size:10px;color:#4ade80;">💰 MÁS BARATO</div>
        <div style="font-size:12px;color:#4ade80;margin-top:4px;">${t.best_option_budget||'?'}</div>
      </div>
      <div style="flex:1;background:#1e3a5f;border:1px solid #38bdf8;border-radius:10px;padding:12px;text-align:center;">
        <div style="font-size:10px;color:#38bdf8;">⚡ MÁS RÁPIDO</div>

async function searchRoute(){
  const from=document.getElementById('route-from').value;
  const to=document.getElementById('route-to').value;
  if(!from||!to) return;
  const container=document.getElementById('route-results');
  container.innerHTML='<div style="text-align:center;padding:16px;color:#94a3b8;">Buscando rutas...</div>';
  try{
    const r=await fetch(`${API}/api/v1/destinations/transport-route?destination=${encodeURIComponent(destData._name)}&from_point=${encodeURIComponent(from)}&to_point=${encodeURIComponent(to)}`,{method:'POST',headers:{'Authorization':`Bearer ${token}`}});
    const d=await r.json();
    let html='';
    if(d.options){
      html+=`<div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px;">
        <div style="font-weight:600;margin-bottom:10px;">📍 ${d.from||from} → ${d.to||to}</div>
        ${d.options.map(o=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #334155;">
            <div><div style="font-weight:600;font-size:14px;">${o.method}</div><div style="color:#94a3b8;font-size:11px;">${o.details||''}</div></div>
            <div style="text-align:right;">
              <div style="font-size:13px;">⏱️ ${o.duration_minutes} min</div>
              <div style="color:#4ade80;font-weight:700;">USD ${o.cost_usd}</div>
              ${o.is_cheapest?'<span style="background:#065f46;color:#4ade80;padding:2px 6px;border-radius:4px;font-size:10px;">💰 Más barato</span>':''}
              ${o.is_fastest?'<span style="background:#1e3a5f;color:#38bdf8;padding:2px 6px;border-radius:4px;font-size:10px;">⚡ Más rápido</span>':''}
            </div>
          </div>
        `).join('')}
      </div>`;
    }
    if(d.car_rental&&d.car_rental.available){
      html+=`<div style="background:#1e293b;border:1px solid #fbbf24;border-radius:12px;padding:16px;margin-bottom:12px;">
        <div style="font-weight:600;color:#fbbf24;margin-bottom:10px;">🚗 Alquiler de auto</div>
        <div style="color:#94a3b8;font-size:12px;margin-bottom:8px;">${d.car_rental.why||''}</div>
        ${(d.car_rental.agencies||[]).map(ag=>`
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #334155;">
            <div><div style="font-weight:600;">${ag.name}</div><div style="color:#94a3b8;font-size:11px;">📍 ${ag.location||''}</div></div>
            <div style="color:#4ade80;font-weight:700;">USD ${ag.price_per_day_usd}/día</div>
          </div>
        `).join('')}
      </div>`;
    }
    container.innerHTML=html||'<div style="color:#f87171;">No se encontraron rutas</div>';
  }catch(e){container.innerHTML='<div style="color:#f87171;">Error buscando rutas</div>';}
}

  const origin=fromCoords[fromCity]||[-58.3816,-34.6037];
  setTimeout(()=>{
    const el=document.getElementById('mapview');
    if(!el)return;
    el.innerHTML='';
    if(currentMapMode==='flight'){
      const map=new mapboxgl.Map({container:'mapview',style:'mapbox://styles/mapbox/dark-v11',center:[0,20],zoom:1.5});
      map.on('load',()=>{
        new mapboxgl.Marker({color:'#38bdf8'}).setLngLat(origin).setPopup(new mapboxgl.Popup().setHTML(`<b>📍 ${fromCity}</b><br>Tu origen`)).addTo(map);
        new mapboxgl.Marker({color:'#f87171'}).setLngLat(dest).setPopup(new mapboxgl.Popup().setHTML(`<b>📍 ${name}</b><br>Tu destino`)).addTo(map);
        // Curved flight line
        const points=[];
        for(let i=0;i<=100;i++){
          const t=i/100;
          const lng=origin[0]+(dest[0]-origin[0])*t;
          const lat=origin[1]+(dest[1]-origin[1])*t+Math.sin(Math.PI*t)*15;
          points.push([lng,lat]);
        }
        map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:points}}});
        map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#38bdf8','line-width':3,'line-dasharray':[2,2]}});
        const bounds=new mapboxgl.LngLatBounds();
        bounds.extend(origin);bounds.extend(dest);
        map.fitBounds(bounds,{padding:80});
      });
    } else if(currentMapMode==='city'){
      const map=new mapboxgl.Map({container:'mapview',style:'mapbox://styles/mapbox/dark-v11',center:dest,zoom:13});
      map.on('load',()=>{
        new mapboxgl.Marker({color:'#38bdf8'}).setLngLat(dest).setPopup(new mapboxgl.Popup().setHTML(`<b>${name}</b> — Centro`)).addTo(map);
        const zones=(destData.accommodation||{}).recommended_zones||[];
        const colors=['#818cf8','#4ade80','#f472b6','#fbbf24'];
        zones.forEach((z,i)=>{
          const offset=[[0.008,0.005],[-0.006,0.008],[0.005,-0.007],[-0.008,-0.005]][i]||[0,0];
          const pos=[dest[0]+offset[1],dest[1]+offset[0]];
          new mapboxgl.Marker({color:colors[i%colors.length]}).setLngLat(pos).setPopup(new mapboxgl.Popup().setHTML(`<b>🏨 ${z.name}</b><br>USD ${z.avg_price_per_night_usd}/noche<br>${z.description||''}`)).addTo(map);
        });
        const hotels=(destData.accommodation||{}).hotels||[];
        hotels.forEach(h=>{
          if(h.longitude&&h.latitude){
            new mapboxgl.Marker({color:'#fbbf24',scale:0.7}).setLngLat([h.longitude,h.latitude]).setPopup(new mapboxgl.Popup().setHTML(`<b>🏨 ${h.name}</b><br>USD ${h.price_per_night_usd}/noche<br>⭐ ${h.rating||'?'}/5`)).addTo(map);
          }
        });
      });
    } else {
      const map=new mapboxgl.Map({container:'mapview',style:'mapbox://styles/mapbox/dark-v11',center:dest,zoom:13});
      map.on('load',()=>{
        new mapboxgl.Marker({color:'#38bdf8'}).setLngLat(dest).setPopup(new mapboxgl.Popup().setHTML(`<b>${name}</b>`)).addTo(map);
        const acts=(destData.activities||{}).must_do||[];
        acts.forEach(a=>{
          if(a.latitude&&a.longitude){
            new mapboxgl.Marker({color:'#f87171',scale:0.8}).setLngLat([a.longitude,a.latitude]).setPopup(new mapboxgl.Popup().setHTML(`<b>${a.name}</b><br>${a.description||''}<br>⏱️ ${a.duration_hours}h ${a.is_free?'| GRATIS':`| USD ${a.cost_usd}`}`)).addTo(map);
          }
        });
      });
    }
  },100);
}

function initItineraryMap(){
  const destCoords={'Tokyo':[139.6503,35.6762],'Paris':[2.3522,48.8566],'París':[2.3522,48.8566],'Bali':[115.092,-8.3405],'Rome':[12.4964,41.9028],'Roma':[12.4964,41.9028],'New York':[-74.006,40.7128],'Cancún':[-86.8515,21.1619],'Machu Picchu':[-72.545,-13.1631],'London':[-0.1278,51.5074],'Londres':[-0.1278,51.5074],'Barcelona':[2.1734,41.3851],'Bangkok':[100.5018,13.7563],'Francia':[2.3522,48.8566]};
  const name=(destData._name||'').split(',')[0].trim();
  const center=destCoords[name]||[2.3522,48.8566];
  const its=destData.suggested_itineraries||[];
  const plan=its[0]||{daily_plan:[]};
  const days=plan.daily_plan||[];
  const currentDay=window._itDay||1;
  const dayData=days.find(d=>d.day_number===currentDay)||days[0]||{};
  const acts=dayData.activities||[];
  
  setTimeout(()=>{
    const el=document.getElementById('itinerary-map');
    if(!el)return;
    el.innerHTML='';
    const map=new mapboxgl.Map({container:'itinerary-map',style:'mapbox://styles/mapbox/dark-v11',center:center,zoom:12});
    map.on('load',()=>{
      // Generate points around center for each activity
      const points=acts.map((a,i)=>{
        const angle=(i/acts.length)*Math.PI*2;
        const radius=0.015+Math.random()*0.01;
        return [center[0]+Math.cos(angle)*radius, center[1]+Math.sin(angle)*radius];
      });
      // Add numbered markers
      points.forEach((p,i)=>{
        const markerEl=document.createElement('div');
        markerEl.style.cssText='width:28px;height:28px;border-radius:50%;background:#f87171;color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid white;';
        markerEl.textContent=i+1;
        new mapboxgl.Marker({element:markerEl}).setLngLat(p).setPopup(new mapboxgl.Popup().setHTML(`<b>${i+1}. ${acts[i]}</b>`)).addTo(map);
      });
      // Draw route line connecting all points
      if(points.length>1){
        map.addSource('itinerary-route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:points}}});
        map.addLayer({id:'itinerary-route',type:'line',source:'itinerary-route',paint:{'line-color':'#f87171','line-width':3,'line-opacity':0.8}});
      }
      // Fit bounds
      if(points.length>0){
        const bounds=new mapboxgl.LngLatBounds();
        points.forEach(p=>bounds.extend(p));
        map.fitBounds(bounds,{padding:50});
      }
    });
  },100);
}
}

// ─── HOTEL MAP ─────────────────────────────────
function initHotelMap(){
  const destCoords={'Tokyo':[139.6503,35.6762],'Paris':[2.3522,48.8566],'París':[2.3522,48.8566],'Bali':[115.092,-8.3405],'Rome':[12.4964,41.9028],'Roma':[12.4964,41.9028],'New York':[-74.006,40.7128],'Cancún':[-86.8515,21.1619],'Machu Picchu':[-72.545,-13.1631],'London':[-0.1278,51.5074],'Londres':[-0.1278,51.5074],'Barcelona':[2.1734,41.3851],'Bangkok':[100.5018,13.7563],'Francia':[2.3522,48.8566]};
  const name=(destData._name||'').split(',')[0].trim();
  const center=destCoords[name]||[2.3522,48.8566];
  setTimeout(()=>{
    const el=document.getElementById('hotel-map');
    if(!el)return;
    el.innerHTML='';
    const map=new mapboxgl.Map({container:'hotel-map',style:'mapbox://styles/mapbox/dark-v11',center:center,zoom:13});
    map.on('load',()=>{
      const hotels=(destData.accommodation||{}).hotels||[];
      hotels.forEach(h=>{
        if(h.longitude&&h.latitude){
          new mapboxgl.Marker({color:'#fbbf24',scale:0.7}).setLngLat([h.longitude,h.latitude]).setPopup(new mapboxgl.Popup().setHTML(`<b>🏨 ${h.name}</b><br><span style="color:#4ade80;font-weight:700;">USD ${h.price_per_night_usd}/noche</span><br>⭐ ${h.rating||'?'}/5 · ${h.type||''}<br>📍 ${h.zone||''}`)).addTo(map);
        }
      });
      const zones=(destData.accommodation||{}).recommended_zones||[];
      const colors=['#818cf8','#4ade80','#f472b6','#fbbf24'];
      zones.forEach((z,i)=>{
        const offset=[[0.008,0.005],[-0.006,0.008],[0.005,-0.007],[-0.008,-0.005]][i]||[0,0];
        const pos=[center[0]+offset[1],center[1]+offset[0]];
        new mapboxgl.Marker({color:colors[i%colors.length]}).setLngLat(pos).setPopup(new mapboxgl.Popup().setHTML(`<b>${z.name}</b><br>USD ${z.avg_price_per_night_usd}/noche<br>${z.description||''}`)).addTo(map);
      });
    });
  },100);
}
