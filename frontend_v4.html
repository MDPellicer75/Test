<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelOS</title>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.mapboxgl-popup-content{background:#1e293b!important;color:#e2e8f0!important;border-radius:10px!important;padding:12px!important;box-shadow:0 4px 20px rgba(0,0,0,0.5)!important;font-family:-apple-system,sans-serif!important;}
.mapboxgl-popup-tip{border-top-color:#1e293b!important;}
.mapboxgl-popup-close-button{color:#e2e8f0!important;font-size:18px!important;}
</style>
</head>
<body>
<div id="app">Cargando...</div>
<script>
const API=window.location.origin;
let token='',destData={},fromCity='Buenos Aires',selections={flight:null,hotel:null,activities:[]};
const TK=new URLSearchParams(window.location.search).get('tk')||localStorage.getItem('mapbox_tk')||'';
if(TK&&typeof mapboxgl!=='undefined'){mapboxgl.accessToken=TK;localStorage.setItem('mapbox_tk',TK);}

function render(h){document.getElementById('app').innerHTML=h;}

function screenLogin(err){
  render(`<div style="max-width:400px;margin:60px auto;padding:20px;">
    <div style="text-align:center;margin-bottom:30px;"><h1 style="font-size:32px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">TravelOS</h1><p style="color:#94a3b8;margin-top:5px;">Tu copiloto de viaje con IA</p></div>
    <div style="background:#1e293b;border-radius:16px;padding:30px;">
      <h2 style="text-align:center;margin-bottom:20px;">Iniciá tu aventura</h2>
      <input id="f-email" type="email" placeholder="Email" value="demo@travelos.com" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
      <input id="f-pass" type="password" placeholder="Contraseña (min 8)" value="Password123!" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
      <input id="f-name" type="text" placeholder="Tu nombre" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
      <input id="f-from" type="text" placeholder="Ciudad de origen" value="Buenos Aires" style="width:100%;padding:14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:white;font-size:16px;margin-bottom:12px;outline:none;">
      <button onclick="doRegister()" style="width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#818cf8);color:white;">Crear cuenta</button>
      <button onclick="doLogin()" style="width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:#334155;color:white;margin-top:10px;">Ya tengo cuenta</button>
      ${err?'<p style="color:#f87171;text-align:center;margin-top:12px;font-size:13px;">'+err+'</p>':''}
    </div></div>`);
}

async function doRegister(){
  const email=document.getElementById('f-email').value,pass=document.getElementById('f-pass').value,name=document.getElementById('f-name').value||'Viajero';
  fromCity=document.getElementById('f-from').value||'Buenos Aires';
  try{
    let r=await fetch(API+'/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass,name:name,language:'es'})});
    if(r.status===409) return doLogin();
    const d=await r.json();
    if(d.access_token){token=d.access_token;screenHome();}else{screenLogin(d.detail||'Error');}
  }catch(e){screenLogin('Error de conexión');}
}

async function doLogin(){
  const email=document.getElementById('f-email').value,pass=document.getElementById('f-pass').value;
  fromCity=document.getElementById('f-from').value||'Buenos Aires';
  try{
    const r=await fetch(API+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
    const d=await r.json();
    if(d.access_token){token=d.access_token;screenHome();}else{screenLogin(d.detail||'Error');}
  }catch(e){screenLogin('Error de conexión');}
}

function screenHome(){
  render(`<div style="background:#1e293b;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;">
    <h1 style="font-size:20px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">TravelOS</h1>
    <span style="color:#94a3b8;font-size:13px;">Desde: <strong style="color:white;">${fromCity}</strong> <span onclick="screenLogin()" style="color:#f87171;cursor:pointer;margin-left:8px;">Salir</span></span>
  </div>
  <div style="max-width:600px;margin:0 auto;padding:20px;">
    <div style="position:relative;"><input id="dest-input" type="text" placeholder="A donde queres ir?" style="width:100%;padding:16px 16px 16px 45px;border:1px solid #334155;border-radius:12px;background:#0f172a;color:white;font-size:18px;outline:none;" onkeypress="if(event.key==='Enter')doExplore()"><span style="position:absolute;left:15px;top:16px;font-size:20px;">🌍</span></div>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <div style="flex:1;"><label style="color:#94a3b8;font-size:11px;">Adultos</label><select id="sel-adults" style="width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:white;font-size:14px;margin-top:4px;"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></div>
      <div style="flex:1;"><label style="color:#94a3b8;font-size:11px;">Niños</label><select id="sel-kids" style="width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:white;font-size:14px;margin-top:4px;"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
      <div style="flex:1;"><label style="color:#94a3b8;font-size:11px;">Clase</label><select id="sel-class" style="width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:white;font-size:14px;margin-top:4px;"><option value="economy">Económica</option><option value="business">Business</option><option value="first">Primera</option></select></div>
    </div>
    <p style="color:#64748b;margin-top:24px;font-size:14px;font-weight:600;">Destinos populares</p>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px;">
      <div onclick="doExplore('Tokyo, Japan')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;text-align:center;"><div style="font-size:32px;">🗼</div><div style="font-weight:600;margin-top:6px;">Tokyo</div></div>
      <div onclick="doExplore('Paris, France')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;text-align:center;"><div style="font-size:32px;">🇫🇷</div><div style="font-weight:600;margin-top:6px;">París</div></div>
      <div onclick="doExplore('New York, USA')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;text-align:center;"><div style="font-size:32px;">🗽</div><div style="font-weight:600;margin-top:6px;">New York</div></div>
      <div onclick="doExplore('Rome, Italy')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;text-align:center;"><div style="font-size:32px;">🏛️</div><div style="font-weight:600;margin-top:6px;">Roma</div></div>
      <div onclick="doExplore('Bali, Indonesia')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;text-align:center;"><div style="font-size:32px;">🏝️</div><div style="font-weight:600;margin-top:6px;">Bali</div></div>
      <div onclick="doExplore('Cancun, Mexico')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;text-align:center;"><div style="font-size:32px;">🏖️</div><div style="font-weight:600;margin-top:6px;">Cancún</div></div>
    </div>
  </div>`);
}

async function doExplore(dest){
  const destination=dest||document.getElementById('dest-input').value;
  if(!destination) return;
  render('<div style="text-align:center;padding:100px 20px;"><div style="width:50px;height:50px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;"></div><h3>Analizando '+destination+'...</h3><p style="color:#94a3b8;margin-top:10px;">Buscando info desde '+fromCity+'</p><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>');
  try{
    const r=await fetch(API+'/api/v1/destinations/explore',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({destination:destination,from_city:fromCity,travelers:1,budget_usd:2500})});
    if(r.status===401){screenLogin('Sesión expirada');return;}
    destData=await r.json();
    destData._name=destination;
    showResults('overview');
  }catch(e){render('<div style="text-align:center;padding:80px;"><h3 style="color:#f87171;">Error</h3><button onclick="screenHome()" style="margin-top:20px;padding:12px 24px;border:none;border-radius:8px;background:#334155;color:white;cursor:pointer;">Volver</button></div>');}
}

// Simple tab system
function showResults(tab){
  const name=(destData._name||'').split(',')[0];
  const tabs=['overview','flights','transport','hotels','activities','itinerary','map','costs','climate','safety'];
  const icons=['📊','✈️','🚇','🏨','🎯','📋','🗺️','💵','🌤️','🛡️'];
  const labels=['Resumen','Vuelos','Transporte','Hoteles','Actividades','Itinerario','Mapa','Costos','Clima','Seguridad'];
  
  let header='<div style="background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #334155;"><span onclick="screenHome()" style="cursor:pointer;font-size:20px;">←</span><h2 style="font-size:18px;flex:1;">'+name+'</h2><span style="color:#94a3b8;font-size:12px;">desde '+fromCity+'</span></div>';
  let tabsHtml='<div style="display:flex;overflow-x:auto;background:#1e293b;border-bottom:1px solid #334155;scrollbar-width:none;">';
  for(let i=0;i<tabs.length;i++){
    const active=tabs[i]===tab;
    tabsHtml+='<div onclick="showResults(\''+tabs[i]+'\')" style="padding:10px 14px;font-size:12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid '+(active?'#38bdf8':'transparent')+';color:'+(active?'#38bdf8':'#94a3b8')+';">'+icons[i]+' '+labels[i]+'</div>';
  }
  tabsHtml+='</div>';
  
  let content='';
  if(tab==='overview') content=tabOverview();
  else if(tab==='flights') content=tabFlights();
  else if(tab==='transport') content=tabTransport();
  else if(tab==='hotels') content=tabHotels();
  else if(tab==='activities') content=tabActivities();
  else if(tab==='itinerary') content=tabItinerary();
  else if(tab==='map') content=tabMap();
  else if(tab==='costs') content=tabCosts();
  else if(tab==='climate') content=tabClimate();
  else if(tab==='safety') content=tabSafety();
  
  render(header+tabsHtml+'<div style="max-width:600px;margin:0 auto;padding:16px;padding-bottom:20px;">'+content+'</div>');
  if(tab==='map') setTimeout(initMap,200);
  if(tab==='hotels') setTimeout(initHotelMap,200);
  if(tab==='activities') setTimeout(initActMap,200);
  if(tab==='itinerary') setTimeout(initItineraryMap,200);
  if(tab==='transport') setTimeout(initTransportMap,200);
}

function initHotelMap(){
  if(typeof mapboxgl==='undefined') return;
  var el=document.getElementById('hotel-map');
  if(!el) return;
  var destCoords={'Tokyo':[139.65,35.67],'Paris':[2.35,48.85],'New York':[-74.0,40.71],'Rome':[12.49,41.9],'Bali':[115.09,-8.34],'Cancun':[-86.85,21.16]};
  var name=(destData._name||'').split(',')[0].trim();
  var center=destCoords[name]||[2.35,48.85];
  hotelMapInstance=new mapboxgl.Map({container:'hotel-map',style:'mapbox://styles/mapbox/dark-v11',center:center,zoom:13});
  hotelMapInstance.on('load',function(){
    var hotels=(destData.accommodation||{}).hotels||[];
    var bounds=new mapboxgl.LngLatBounds();
    var hasPoints=false;
    hotels.forEach(function(h){
      if(h.latitude&&h.longitude){
        hasPoints=true;
        bounds.extend([h.longitude,h.latitude]);
        new mapboxgl.Marker({color:'#fbbf24',scale:0.8}).setLngLat([h.longitude,h.latitude]).setPopup(new mapboxgl.Popup().setHTML('<b>'+h.name+'</b><br><span style="color:green;font-weight:bold;">USD '+h.price_per_night_usd+'/n</span><br>⭐ '+(h.rating||'?')+'/5<br>'+(h.type||'')+'<br>📍 '+(h.zone||''))).addTo(hotelMapInstance);
      }
    });
    if(hasPoints){hotelMapInstance.fitBounds(bounds,{padding:40,maxZoom:15});}
  });
}

function tabOverview(){
  const qs=destData.quick_stats||{};
  return '<div style="background:#1e293b;border-radius:12px;padding:20px;margin-bottom:16px;"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;"><div><div style="color:#94a3b8;font-size:11px;">COSTO/DIA</div><div style="font-size:24px;font-weight:700;color:#4ade80;">USD '+(qs.avg_cost_per_day_usd||'?')+'</div></div><div><div style="color:#94a3b8;font-size:11px;">DIAS IDEALES</div><div style="font-size:24px;font-weight:700;">'+(qs.ideal_days||'?')+'</div></div></div></div>';
}

function tabFlights(){
  const f=destData.flights||{};
  const opts=f.options||[];
  let h='<h3 style="margin-bottom:16px;">✈️ Vuelos desde '+fromCity+'</h3>';
  h+='<div style="display:flex;gap:12px;margin-bottom:16px;"><div style="flex:1;background:#1e293b;border-radius:10px;padding:14px;text-align:center;"><div style="color:#94a3b8;font-size:11px;">MAS BARATO</div><div style="font-size:20px;font-weight:700;color:#4ade80;">USD '+(f.cheapest_price||'?')+'</div></div><div style="flex:1;background:#1e293b;border-radius:10px;padding:14px;text-align:center;"><div style="color:#94a3b8;font-size:11px;">MAS RAPIDO</div><div style="font-size:20px;font-weight:700;color:#38bdf8;">'+(f.fastest_duration_hours||'?')+'h</div></div></div>';
  opts.forEach(function(o){
    var searchUrl='https://www.google.com/travel/flights?q=flights+from+'+encodeURIComponent(fromCity)+'+to+'+encodeURIComponent((destData._name||'').split(',')[0])+'+'+encodeURIComponent(o.airline);
    h+='<a href="'+searchUrl+'" target="_blank" style="text-decoration:none;color:inherit;display:block;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;" onmouseover="this.style.borderColor=\'#38bdf8\'" onmouseout="this.style.borderColor=\'#334155\'"><div style="display:flex;justify-content:space-between;"><div style="font-weight:600;color:#e2e8f0;">'+o.airline+'</div><div style="color:#4ade80;font-weight:700;font-size:18px;">USD '+o.price_usd+'</div></div><div style="color:#94a3b8;font-size:13px;margin-top:8px;">⏱️ '+o.duration_hours+'h · '+(o.stops===0?'<span style="color:#4ade80;">Directo</span>':o.stops+' escala(s): '+(o.stop_cities||[]).join(', '))+'</div><div style="color:#38bdf8;font-size:11px;margin-top:6px;">🔗 Buscar en Google Flights →</div></a>';
  });
  return h;
}

function tabHotels(){
  const a=destData.accommodation||{};
  const zones=a.recommended_zones||[];
  const hotels=a.hotels||[];
  let h='<h3 style="margin-bottom:16px;">🏨 Alojamiento</h3>';
  h+='<div id="hotel-map" style="height:250px;border-radius:12px;margin-bottom:16px;"></div>';
  h+='<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">';
  var types=['Todos','Luxury','Boutique','Hotel','Hostel','Apartment'];
  types.forEach(function(t){
    var active=(hotelTypeFilter===t);
    h+='<button onclick="hotelTypeFilter=\''+t+'\';showResults(\'hotels\')" style="padding:6px 12px;border:1px solid '+(active?'#fbbf24':'#334155')+';border-radius:6px;background:'+(active?'#713f12':'#1e293b')+';color:'+(active?'#fbbf24':'#94a3b8')+';cursor:pointer;font-size:11px;">'+t+'</button>';
  });
  h+='</div>';
  h+='<p style="color:#94a3b8;font-size:13px;margin-bottom:12px;">Tocá una zona → el mapa se mueve + carga hoteles:</p>';
  zones.forEach(function(z){
    h+='<div onclick="loadZoneHotels(\''+z.name.replace(/'/g,"\\'")+'\','+JSON.stringify([z.avg_price_per_night_usd||0]).replace(/"/g,'&quot;')+')" style="background:#1e293b;border:1px solid '+(selectedZone===z.name?'#fbbf24':'#334155')+';border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;" onmouseover="this.style.borderColor=\'#fbbf24\'" onmouseout="this.style.borderColor=\''+(selectedZone===z.name?'#fbbf24':'#334155')+'\'"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:600;">'+z.name+'</div><div style="color:#94a3b8;font-size:12px;margin-top:2px;">'+z.description+'</div></div><div style="text-align:right;"><div style="color:#4ade80;font-weight:700;">USD '+z.avg_price_per_night_usd+'/n</div><div style="color:#fbbf24;font-size:11px;">Ver hoteles →</div></div></div></div>';
  });
  var filtered=hotels;
  if(hotelTypeFilter!=='Todos'){filtered=hotels.filter(function(ho){var t=(ho.type||'').toLowerCase();var f=hotelTypeFilter.toLowerCase();return t.indexOf(f)>-1||f.indexOf(t)>-1||t.indexOf(f.substring(0,4))>-1;});
  if(filtered.length===0){filtered=hotels;}}
  if(filtered.length>0){
    h+='<h4 style="font-size:15px;margin:16px 0 12px;">🏨 Hoteles cargados ('+filtered.length+' de '+hotels.length+'):</h4>';
    filtered.forEach(function(ho,idx){
      h+='<div onclick="focusHotelOnMap('+ho.latitude+','+ho.longitude+',\''+ho.name.replace(/'/g,"\\'")+'\')" style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;" onmouseover="this.style.borderColor=\'#fbbf24\'" onmouseout="this.style.borderColor=\'#334155\'"><div style="display:flex;justify-content:space-between;"><div style="font-weight:600;">'+ho.name+'</div><div style="color:#4ade80;font-weight:700;">USD '+ho.price_per_night_usd+'/n</div></div><div style="color:#94a3b8;font-size:12px;margin-top:4px;">⭐ '+(ho.rating||'?')+'/5 · '+(ho.type||'hotel')+' · 📍 '+(ho.zone||'')+'</div><div style="color:#38bdf8;font-size:10px;margin-top:4px;">Click → ver en mapa</div></div>';
    });
    h+='<button onclick="loadMoreZoneHotels()" id="btn-more-h" style="width:100%;margin-top:8px;padding:12px;border:1px solid #fbbf24;border-radius:10px;background:transparent;color:#fbbf24;font-weight:600;cursor:pointer;font-size:13px;">Cargar 10 más</button>';
  }
  return h;
}
var hotelTypeFilter='Todos';
var selectedZone='';
var hotelMapInstance=null;

async function loadZoneHotels(zone){
  selectedZone=zone;
  showResults('hotels');
  var container=document.getElementById('hotel-map');
  try{
    var r=await fetch(API+'/api/v1/destinations/hotels-by-zone?destination='+encodeURIComponent(destData._name)+'&zone='+encodeURIComponent(zone),{method:'POST',headers:{'Authorization':'Bearer '+token}});
    var d=await r.json();
    if(d.hotels){
      if(!destData.accommodation.hotels) destData.accommodation.hotels=[];
      destData.accommodation.hotels=destData.accommodation.hotels.concat(d.hotels);
      showResults('hotels');
    }
  }catch(e){}
}
async function loadMoreZoneHotels(){
  var btn=document.getElementById('btn-more-h');
  if(btn) btn.textContent='Cargando...';
  var zone=selectedZone||(destData.accommodation.recommended_zones||[])[0]?.name||'centro';
  try{
    var r=await fetch(API+'/api/v1/destinations/hotels-by-zone?destination='+encodeURIComponent(destData._name)+'&zone='+encodeURIComponent(zone),{method:'POST',headers:{'Authorization':'Bearer '+token}});
    var d=await r.json();
    if(d.hotels){
      if(!destData.accommodation.hotels) destData.accommodation.hotels=[];
      destData.accommodation.hotels=destData.accommodation.hotels.concat(d.hotels);
      showResults('hotels');
    }
  }catch(e){if(btn) btn.textContent='Error, intentá de nuevo';}
}
function focusHotelOnMap(lat,lng,name){
  if(hotelMapInstance&&lat&&lng){
    hotelMapInstance.flyTo({center:[lng,lat],zoom:16,duration:1500});
    // Add a highlighted marker at that location
    setTimeout(function(){
      var el=document.createElement('div');
      el.style.cssText='width:30px;height:30px;border-radius:50%;background:#f87171;border:3px solid white;box-shadow:0 0 10px rgba(248,113,113,0.6);animation:pulse 1s infinite;';
      el.innerHTML='<style>@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}</style>';
      new mapboxgl.Marker({element:el}).setLngLat([lng,lat]).setPopup(new mapboxgl.Popup({offset:15}).setHTML('<b style="color:#fbbf24;">'+name+'</b>')).addTo(hotelMapInstance).togglePopup();
    },1600);
  }
}

function tabActivities(){
  const acts=(destData.activities||{}).must_do||[];
  let h='<h3 style="margin-bottom:16px;">🎯 Actividades ('+acts.length+')</h3>';
  h+='<div id="act-map" style="height:250px;border-radius:12px;margin-bottom:16px;"></div>';
  h+='<p style="color:#94a3b8;font-size:12px;margin-bottom:12px;">Tocá una actividad → el mapa se centra ahí</p>';
  acts.forEach(function(a,i){

function highlightRoute(method){

  var color=colors[method]||'#38bdf8';

    h+='<div onclick="showActivityDetail('+i+')" style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #334155;cursor:pointer;" onmouseover="this.style.background=\'#1e293b\'" onmouseout="this.style.background=\'transparent\'">';
    h+='<div style="width:28px;height:28px;border-radius:50%;background:#f87171;color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+(i+1)+'</div>';
    h+='<div style="color:#94a3b8;font-size:12px;width:45px;flex-shrink:0;">'+timeStr+'</div>';
    h+='<div style="font-size:14px;flex:1;">'+a+'</div>';
    h+='<div style="color:#64748b;font-size:16px;">›</div>';
    h+='</div>';
  });
  h+='</div>';
  // Right: map
  h+='<div style="flex:1;min-width:280px;"><div id="itin-map" style="height:380px;border-radius:12px;position:sticky;top:80px;"></div></div>';
  h+='</div>';
  // Activity detail modal
  h+='<div id="activity-detail"></div>';
  return h;
}
var itinIndex=0;

function showActivityDetail(idx){
  var its=destData.suggested_itineraries||[];
  var plan=its[itinIndex||0]||{daily_plan:[]};
  var days=plan.daily_plan||[];
  var currentDay=window._itDay||1;
  var dayData=days.find(function(d){return d.day_number===currentDay;})||days[0]||{activities:[]};
  var acts=dayData.activities||[];
  var actName=acts[idx]||'';
  var name=(destData._name||'').split(',')[0];
  // Try to find matching activity in destData.activities for more info
  var allActs=(destData.activities||{}).must_do||[];
  var match=allActs.find(function(a){return actName.toLowerCase().indexOf(a.name.toLowerCase().substring(0,10))>-1||a.name.toLowerCase().indexOf(actName.toLowerCase().substring(0,10))>-1;});
  
  var container=document.getElementById('activity-detail');
  if(!container) return;
  var mapsUrl='https://www.google.com/maps/search/'+encodeURIComponent(actName+' '+name);
  
  container.innerHTML='<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)this.innerHTML=\'\'"><div style="background:#1e293b;border-radius:16px;padding:24px;max-width:450px;width:100%;max-height:80vh;overflow-y:auto;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h3 style="font-size:18px;">'+actName+'</h3><span onclick="document.getElementById(\'activity-detail\').innerHTML=\'\'" style="cursor:pointer;font-size:24px;color:#94a3b8;">✕</span></div>'+(match?'<div style="color:#94a3b8;font-size:13px;margin-bottom:12px;">'+(match.description||'')+'</div><div style="display:flex;gap:16px;margin-bottom:16px;"><div>⏱️ <strong>'+(match.duration_hours||'?')+'h</strong></div><div>💰 <strong>'+(match.is_free?'GRATIS':'USD '+match.cost_usd)+'</strong></div><div>⭐ <strong>'+(match.rating||'?')+'/5</strong></div></div>':'<div style="color:#94a3b8;font-size:13px;margin-bottom:12px;">Actividad del itinerario</div>')+'<div style="display:flex;gap:8px;"><a href="'+mapsUrl+'" target="_blank" style="flex:1;padding:12px;border:none;border-radius:8px;background:#334155;color:#38bdf8;text-align:center;text-decoration:none;font-weight:600;font-size:13px;">📍 Ver en Maps</a><a href="https://www.google.com/search?q='+encodeURIComponent(actName+' '+name+' tickets')+'" target="_blank" style="flex:1;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:white;text-align:center;text-decoration:none;font-weight:600;font-size:13px;">🎫 Reservar</a></div></div></div>';
}
function initItineraryMap(){
  if(typeof mapboxgl==='undefined') return;
  var el=document.getElementById('itin-map');
  if(!el) return;
  var destCoords={'Tokyo':[139.65,35.67],'Paris':[2.35,48.85],'New York':[-74.0,40.71],'Rome':[12.49,41.9],'Bali':[115.09,-8.34],'Cancun':[-86.85,21.16]};
  var name=(destData._name||'').split(',')[0].trim();
  var center=destCoords[name]||[2.35,48.85];
  var its=destData.suggested_itineraries||[];
  var plan=its[itinIndex||0]||{daily_plan:[]};
  var days=plan.daily_plan||[];
  var currentDay=window._itDay||1;
  var dayData=days.find(function(d){return d.day_number===currentDay;})||days[0]||{activities:[]};
  var acts=dayData.activities||[];
  var map=new mapboxgl.Map({container:'itin-map',style:'mapbox://styles/mapbox/dark-v11',center:center,zoom:13});
  map.on('load',function(){
    var points=acts.map(function(a,i){var angle=(i/Math.max(acts.length,1))*Math.PI*2;var r=0.012+Math.random()*0.006;return [center[0]+Math.cos(angle)*r,center[1]+Math.sin(angle)*r];});
    points.forEach(function(p,i){
      var markerEl=document.createElement('div');
      markerEl.style.cssText='width:26px;height:26px;border-radius:50%;background:#f87171;color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid white;cursor:pointer;';
      markerEl.textContent=i+1;
      markerEl.onclick=function(){showActivityDetail(i);};
      new mapboxgl.Marker({element:markerEl}).setLngLat(p).setPopup(new mapboxgl.Popup({offset:15}).setHTML('<b>'+(i+1)+'. '+acts[i]+'</b>')).addTo(map);
    });
    if(points.length>1){
      map.addSource('itin',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:points}}});
      map.addLayer({id:'itin',type:'line',source:'itin',paint:{'line-color':'#f87171','line-width':2.5}});
      var bounds=new mapboxgl.LngLatBounds();points.forEach(function(p){bounds.extend(p);});
      map.fitBounds(bounds,{padding:40});
    }
  });
}

try{screenLogin();}catch(e){document.getElementById('app').innerHTML='<div style="padding:40px;color:red;"><h2>Error:</h2><pre>'+e.message+'</pre></div>';}
</script>
